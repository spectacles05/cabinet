<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Cabinet system architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15171c" />
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 700; fill: #15171c; }
      .b { font-size: 13px; font-weight: 600; fill: #15171c; }
      .s { font-size: 11.5px; fill: #4a4f58; }
      .n { font-size: 11px; fill: #4a4f58; }
      .lbl { font-size: 11px; fill: #15171c; }
      .box { fill: #ffffff; stroke: #c9c2b4; stroke-width: 1; }
      .line { stroke: #15171c; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#fbfaf7" />
  <text x="30" y="38" style="font-size: 20px; font-weight: 700; fill: #15171c; font-family: Georgia, serif">Cabinet · system architecture</text>
  <text x="30" y="58" class="n">The live version (v1.0, coverclarity.vercel.app). Arrows show what calls what.</text>

  <!-- Browser -->
  <rect x="30" y="100" width="250" height="250" rx="14" fill="#e8f0f8" stroke="#2f6ea6" stroke-width="1.2" />
  <text x="48" y="127" class="h">User's browser</text>
  <rect x="46" y="142" width="218" height="78" rx="10" class="box" />
  <text x="60" y="164" class="b">Cabinet web app</text>
  <text x="60" y="183" class="s">React 19 UI: Home · Ask ·</text>
  <text x="60" y="199" class="s">Cover Check · Claims · Profile</text>
  <rect x="46" y="234" width="218" height="96" rx="10" class="box" />
  <text x="60" y="256" class="b">Supabase browser client</text>
  <text x="60" y="275" class="s">Sign-in with the public anon key</text>
  <text x="60" y="291" class="s">Uploads PDFs and evidence straight</text>
  <text x="60" y="307" class="s">to the user's own private folder</text>

  <!-- Trust notes -->
  <rect x="30" y="372" width="250" height="300" rx="14" fill="#ffffff" stroke="#c9c2b4" stroke-width="1" />
  <text x="48" y="399" class="h">Trust boundaries</text>
  <text x="48" y="426" class="b">1  Session checked twice</text>
  <text x="62" y="443" class="s">proxy redirect, then getUser()</text>
  <text x="62" y="458" class="s">in every page and API route</text>
  <text x="48" y="486" class="b">2  Data access as the user</text>
  <text x="62" y="503" class="s">forced RLS + storage policies;</text>
  <text x="62" y="518" class="s">no service-role key deployed</text>
  <text x="48" y="546" class="b">3  AI sees only the user's text</text>
  <text x="62" y="563" class="s">no tools; fixed output schema;</text>
  <text x="62" y="578" class="s">every quote verified before use</text>
  <text x="48" y="606" class="b">4  The user starts the changes</text>
  <text x="62" y="623" class="s">to policies and Claim Files</text>
  <text x="62" y="638" class="s">(Save, tick, edit, delete)</text>

  <!-- Vercel / Next.js -->
  <rect x="340" y="100" width="500" height="572" rx="14" fill="#f6f4ef" stroke="#15171c" stroke-width="1.2" />
  <text x="358" y="127" class="h">Vercel · Next.js 16 (App Router)</text>
  <rect x="356" y="140" width="468" height="44" rx="10" class="box" />
  <text x="370" y="160" class="b">proxy.ts</text>
  <text x="370" y="176" class="s">Refreshes the Supabase session cookie; sends signed-out visitors to /login</text>
  <rect x="356" y="196" width="226" height="64" rx="10" class="box" />
  <text x="370" y="218" class="b">Server Components</text>
  <text x="370" y="236" class="s">Pages read the user's data</text>
  <text x="370" y="251" class="s">server-side, as the user</text>
  <rect x="598" y="196" width="226" height="64" rx="10" class="box" />
  <text x="612" y="218" class="b">Route handlers /api/*</text>
  <text x="612" y="236" class="s">getUser() · zod input checks</text>
  <text x="612" y="251" class="s">safe errors · refusal logging</text>

  <text x="358" y="288" class="n" style="font-weight: 700; letter-spacing: 1px">SERVICE LAYER (src/lib, server-only)</text>
  <rect x="356" y="298" width="226" height="64" rx="10" class="box" />
  <text x="370" y="320" class="b">Ingest &amp; PDF reader</text>
  <text x="370" y="338" class="s">unpdf text per page · injection</text>
  <text x="370" y="353" class="s">filter · page-bound chunks</text>
  <rect x="598" y="298" width="226" height="64" rx="10" class="box" />
  <text x="612" y="320" class="b">Policy extraction</text>
  <text x="612" y="338" class="s">Claude or rule-based reader,</text>
  <text x="612" y="353" class="s">then the evidence verifier</text>
  <rect x="356" y="374" width="226" height="64" rx="10" class="box" />
  <text x="370" y="396" class="b">Policy Q&amp;A</text>
  <text x="370" y="414" class="s">full-text retrieval · answer</text>
  <text x="370" y="429" class="s">engine · citation verifier</text>
  <rect x="598" y="374" width="226" height="64" rx="10" class="box" />
  <text x="612" y="396" class="b">Your Cover review</text>
  <text x="612" y="414" class="s">deterministic checks · Claude</text>
  <text x="612" y="429" class="s">picks from verified exclusions</text>
  <rect x="356" y="450" width="226" height="64" rx="10" class="box" />
  <text x="370" y="472" class="b">Claim Files</text>
  <text x="370" y="490" class="s">triage · policy check · claim</text>
  <text x="370" y="505" class="s">verifier · private evidence</text>
  <rect x="598" y="450" width="226" height="64" rx="10" class="box" />
  <text x="612" y="472" class="b">Guards</text>
  <text x="612" y="490" class="s">daily AI budget · rate limits</text>
  <text x="612" y="505" class="s">run logger (allowlisted metadata)</text>
  <rect x="356" y="526" width="468" height="64" rx="10" fill="#fdf8ee" stroke="#b5852f" stroke-width="1" />
  <text x="370" y="548" class="b">Rule-based engines (no AI)</text>
  <text x="370" y="566" class="s">Fallback reader, Q&amp;A and claim check when Claude is unavailable or over budget;</text>
  <text x="370" y="580" class="s">Demo Mode prepared answers. All output passes the same verifiers.</text>
  <text x="358" y="618" class="n">Secrets stay server-side: ANTHROPIC_API_KEY is read only by src/lib/ai/client.ts.</text>
  <text x="358" y="634" class="n">CABINET_MODE (live / demo / switchable) and AI_ENGINE (auto / claude / rules)</text>
  <text x="358" y="650" class="n">decide which engine runs; Demo Mode cannot create an Anthropic client.</text>

  <!-- Supabase -->
  <rect x="930" y="100" width="240" height="430" rx="14" fill="#e6f1e8" stroke="#2e7a4e" stroke-width="1.2" />
  <text x="948" y="127" class="h">Supabase</text>
  <rect x="946" y="140" width="208" height="64" rx="10" class="box" />
  <text x="960" y="162" class="b">Auth</text>
  <text x="960" y="180" class="s">Email + password; JWT in</text>
  <text x="960" y="195" class="s">SameSite=Lax cookies</text>
  <rect x="946" y="216" width="208" height="166" rx="10" class="box" />
  <text x="960" y="238" class="b">Postgres</text>
  <text x="960" y="257" class="s">12 user tables, RLS forced:</text>
  <text x="960" y="272" class="s">user_id = auth.uid()</text>
  <text x="960" y="290" class="s">Composite (id, user_id) keys</text>
  <text x="960" y="308" class="s">search_chunks(): full-text,</text>
  <text x="960" y="323" class="s">security invoker</text>
  <text x="960" y="341" class="s">ai_calls_last_day(): count only</text>
  <text x="960" y="359" class="s">Append-only execution log</text>
  <rect x="946" y="394" width="208" height="120" rx="10" class="box" />
  <text x="960" y="416" class="b">Storage (private)</text>
  <text x="960" y="435" class="s">policy-pdfs: PDF only</text>
  <text x="960" y="451" class="s">claim-evidence: PDF / images</text>
  <text x="960" y="469" class="s">15 MB cap · owner-folder</text>
  <text x="960" y="484" class="s">policies · 60-second</text>
  <text x="960" y="499" class="s">signed URLs</text>

  <!-- Anthropic -->
  <rect x="930" y="556" width="240" height="116" rx="14" fill="#fbf1dc" stroke="#9c7212" stroke-width="1.2" />
  <text x="948" y="583" class="h">Anthropic API</text>
  <text x="948" y="604" class="b">Claude · claude-opus-5-5</text>
  <text x="948" y="623" class="s">Structured outputs (zod schema),</text>
  <text x="948" y="639" class="s">no tools, 5 call types: extract,</text>
  <text x="948" y="655" class="s">answer, review, triage, claim check</text>

  <!-- Arrows: browser to Next.js -->
  <path d="M264 181 L338 181" class="line" marker-end="url(#arrow)" />
  <text x="287" y="166" class="lbl">HTTPS</text>

  <!-- Arrows: browser direct to Supabase (over the top) -->
  <path d="M155 100 L155 80 L1050 80 L1050 98" class="line" marker-end="url(#arrow)" />
  <text x="380" y="74" class="lbl">Direct from the browser: sign-in (Auth) and file upload into the user's own folder (Storage); opening a file via a 60-second signed URL</text>

  <!-- Arrows: Next.js to Supabase -->
  <path d="M824 228 L944 228" class="line" marker-end="url(#arrow)" />
  <text x="845" y="206" class="lbl">as the signed-in</text>
  <text x="845" y="219" class="lbl">user (RLS)</text>
  <path d="M824 300 L944 300" class="line" marker-end="url(#arrow)" />
  <text x="845" y="291" class="lbl">full-text search</text>
  <path d="M824 482 L944 482" class="line" marker-end="url(#arrow)" />
  <text x="845" y="460" class="lbl">private files</text>
  <text x="845" y="473" class="lbl">(as the user)</text>

  <!-- Arrow: Next.js to Anthropic -->
  <path d="M824 614 L928 614" class="line" marker-end="url(#arrow)" />
  <text x="845" y="592" class="lbl">user's own text</text>
  <text x="845" y="605" class="lbl">(server key)</text>

  <text x="30" y="712" class="n">Not shown: Vercel serves static assets and the public pages (landing, login, FAQ, privacy, terms). Every AI request is preceded by a logged budget check;</text>
  <text x="30" y="728" class="n">every model output is checked by deterministic server code before it is shown or stored. Cabinet makes no other outbound calls (verified by an automated test).</text>
</svg>
